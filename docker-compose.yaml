version: '3.8'

services:
  hero-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hero-api
    restart: unless-stopped
    ports:
      - "${HERO_PORT:-1337}:1337"
    environment:
      - NODE_ENV=production
      - HERO_PORT=1337
      - HERO_HOST=0.0.0.0
      # Hero Core configuration
      - ULX_DATA_DIR=/data
      - ULX_NO_CHROME_SANDBOX=true
      - ULX_DISABLE_GPU=true
      # Optional: Disable MITM proxy (uncomment if needed)
      # - ULX_DISABLE_MITM=true
      # Optional: Show Chrome browser window (for debugging)
      # - ULX_SHOW_CHROME=true
    volumes:
      # Persist Hero data (sessions, certificates, browser profiles)
      - hero-data:/data
      # Share memory for Chrome
      - /dev/shm:/dev/shm
    # Security options for running Chrome in container
    security_opt:
      - seccomp:unconfined
    # Increase shared memory size
    shm_size: '2gb'
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "const ws = new (require('ws'))('ws://localhost:1337'); ws.on('open', () => process.exit(0)); ws.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 5000);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hero-data:
    driver: local
